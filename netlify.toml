[build]
  publish = "build"
  command = "npm ci --legacy-peer-deps || (rm -rf node_modules && npm install --legacy-peer-deps) && npm run build"

[build.environment]
  NODE_VERSION = "20.x"
  NPM_FLAGS = "--legacy-peer-deps"

[dev]
  command = "npm start"
  port = 3000
  publish = "build"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions]
  directory = "netlify/functions"